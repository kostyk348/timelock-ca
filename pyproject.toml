[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timelock-ca"
version = "0.1.0"
description = "Reversible, non-float compute substrates: Margolus CA, HPP lattice gas, symplectic adjoint networks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "timelock-ca contributors" }]
keywords = ["reversible-computing", "cellular-automata", "lattice-gas",
            "symplectic", "hamiltonian", "adjoint-method"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3"]
dev = ["pytest>=7", "scikit-learn>=1.3"]

[project.scripts]
timelock-ca = "timelock_ca.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
