name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - run: pytest -q
      - name: CLI smoke
        run: |
          timelock-ca margolus
          timelock-ca topo --steps 50
          # defaults (120 эпох, n=400) — режим, в котором README обещает 94.75%
          # и в котором tests/test_symplectic.py проверяет accuracy > 0.9
          timelock-ca train
